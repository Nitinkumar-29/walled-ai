[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Human-in-the-loop approval gate for MCP tool calls made by Claude Desktop and Claude Web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
